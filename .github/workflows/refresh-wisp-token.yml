name: Refresh WISP token exports

on:
  push:
    branches: [main]
    paths:
      - assets/wisp-token/wisp-token-256.png
      - .github/workflows/refresh-wisp-token.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate large WISP PNG exports
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("assets/wisp-token")
          src = Image.open(root / "wisp-token-256.png").convert("RGBA")

          for size in (512, 1024):
              image = src.resize((size, size), Image.Resampling.LANCZOS)
              image = image.quantize(
                  colors=256,
                  method=Image.Quantize.FASTOCTREE,
                  dither=Image.Dither.FLOYDSTEINBERG,
              )
              image.save(root / f"wisp-token-{size}.png", optimize=True)
          PY
      - name: Commit generated exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wisp-token/wisp-token-512.png assets/wisp-token/wisp-token-1024.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(brand): refresh WISP token exports"
            git push
          fi
