name: Finalize WISP token artwork

on:
  push:
    branches: [main]
    paths:
      - ".github/wisp-token-seed/**"
      - ".github/workflows/refresh-wisp-token.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Restore exact WISP artwork seed
        run: |
          cat .github/wisp-token-seed/chunk-* | base64 --decode > assets/wisp-token/wisp-token-256.png
          echo "7672e9a342fbf7665bfd00d3985d8272fa95ded051dd0284accb39d61e7ca259  assets/wisp-token/wisp-token-256.png" | sha256sum -c -
      - name: Export WISP token sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("assets/wisp-token")
          src = Image.open(root / "wisp-token-256.png").convert("RGBA")
          for size in (128, 512, 1024):
              out = src.resize((size, size), Image.Resampling.LANCZOS)
              out = out.quantize(
                  colors=256,
                  method=Image.Quantize.FASTOCTREE,
                  dither=Image.Dither.FLOYDSTEINBERG,
              )
              out.save(root / f"wisp-token-{size}.png", optimize=True)
          PY
      - name: Commit final assets and remove bootstrap files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .github/wisp-token-seed .github/workflows/refresh-wisp-token.yml
          git add assets/wisp-token/wisp-token-128.png assets/wisp-token/wisp-token-256.png assets/wisp-token/wisp-token-512.png assets/wisp-token/wisp-token-1024.png
          git commit -m "fix(brand): finalize WISP token artwork"
          git push
